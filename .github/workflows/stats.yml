name: refresh-stats-cards

# Renders the two GitHub cards in the README from the GitHub API, so they never
# depend on a third-party card service being up.
on:
  schedule:
    - cron: "17 2 * * 1"   # every Monday, 07:47 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "stats: refresh cards"
          git push
